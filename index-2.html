<meta name="theme-color" content="#5aa9ff">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--bg:#dff3ff;--surface:#fff;--ink:#23304d;--muted:#5f6d8a;--sun:#ffc93c;--coral:#ff7a6b;--mint:#4fd1a5;--sky:#5aa9ff;--grape:#9b7bff;--line:#bcd9ee;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17213a;--surface:#222f4f;--ink:#f2f5ff;--muted:#a9b6d4;--line:#36466b}}
:root[data-theme="dark"]{--bg:#17213a;--surface:#222f4f;--ink:#f2f5ff;--muted:#a9b6d4;--line:#36466b}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Fredoka,"Noto Sans Thai","Trebuchet MS",system-ui,sans-serif;min-height:100vh}
main{max-width:480px;margin:0 auto;padding:20px 16px 40px}
.hidden{display:none!important}
h1{font-size:34px;margin:0;font-weight:700}
.hero{text-align:center;margin:12px 0 20px}
.logo{font-size:64px;line-height:1}
.hero p{color:var(--muted);margin:6px 0 0;font-size:18px}
.panel{background:var(--surface);border-radius:28px;padding:22px;border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink)}
label{display:block;font-weight:500;margin:0 0 6px;font-size:17px}
input{width:100%;font:inherit;font-size:20px;padding:14px;border-radius:16px;border:3px solid var(--line);background:var(--bg);color:var(--ink);margin-bottom:16px}
input:focus{border-color:var(--sky);outline:none}
.avatars{display:flex;gap:8px;justify-content:space-between;margin-bottom:18px}
.avatars button{flex:1;font-size:32px;padding:8px 0;border-radius:16px;border:3px solid var(--line);background:var(--bg);cursor:pointer}
.avatars button[aria-pressed="true"]{border-color:var(--ink);background:var(--sun)}
.big{width:100%;font:inherit;font-size:22px;font-weight:700;padding:16px;border-radius:20px;border:3px solid var(--ink);background:var(--mint);color:#10303a;cursor:pointer;box-shadow:0 5px 0 var(--ink)}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.err{color:var(--coral);font-weight:500;min-height:22px;margin:0 0 10px}
:focus-visible{outline:4px solid var(--grape);outline-offset:3px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.me{font-size:44px;background:var(--sun);border-radius:50%;width:68px;height:68px;display:grid;place-items:center;border:3px solid var(--ink)}
.top h2{margin:0;font-size:26px;line-height:1.1}
.top p{margin:2px 0 0;color:var(--muted)}
.out{margin-left:auto;font:inherit;border:3px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:8px 12px;cursor:pointer}
.goal{background:var(--surface);border:3px solid var(--ink);border-radius:22px;padding:14px 16px;margin-bottom:18px}
.goal b{font-size:18px}
.stars{font-size:28px;letter-spacing:4px;margin-top:4px}
h3{margin:0 0 10px;font-size:22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{font:inherit;color:#1c2540;text-align:left;border:3px solid var(--ink);border-radius:24px;padding:16px;min-height:130px;cursor:pointer;box-shadow:0 5px 0 var(--ink);display:flex;flex-direction:column;justify-content:space-between}
.tile:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.tile i{font-style:normal;font-size:44px;line-height:1}
.tile b{font-size:21px}
.tile small{display:block;font-size:14px;opacity:.8}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:500}
#chat{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(12px + env(safe-area-inset-bottom,0px));max-width:480px;margin:0 auto;z-index:5}
.chead{display:flex;align-items:center;gap:10px;margin-bottom:10px}.chead b{font-size:22px;flex:1}
#msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 0}
.m{max-width:85%;padding:12px 14px;border-radius:20px;font-size:19px;line-height:1.35;border:3px solid var(--ink);white-space:pre-wrap}
.m.owl{background:var(--surface);align-self:flex-start}.m.kid{background:var(--sun);color:#1c2540;align-self:flex-end}
.crow{display:flex;gap:8px;margin-top:10px}.crow input{margin:0;flex:1}.crow .big{width:auto;padding:12px 18px;font-size:20px}
#lesson{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));max-width:480px;margin:0 auto;z-index:4;overflow-y:auto}
#lv{font-size:84px;text-align:center;margin:12px 0;line-height:1.1;overflow-wrap:anywhere}
#lp{font-size:24px;font-weight:700;text-align:center;margin:0 0 16px}
#lo{display:grid;gap:12px}#lo .big{background:var(--surface);color:var(--ink);font-size:26px}#lo .big:disabled{opacity:1}
#lf{text-align:center;font-size:22px;font-weight:700;min-height:30px;margin:12px 0 0}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--surface);border-top:3px solid var(--ink);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:6;max-width:480px;margin:0 auto}
#nav button{flex:1;background:none;border:0;font:inherit;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px;font-weight:600;padding:4px;cursor:pointer;border-radius:14px}
#nav button i{font-style:normal;font-size:28px;line-height:1}
#nav button[aria-current="page"]{background:var(--sun);color:#1c2540}
main{padding-bottom:110px!important}
#ask{display:none!important}
#lesson,#chat{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))!important}
.toast{bottom:calc(100px + env(safe-area-inset-bottom,0px))!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

function tone(f,t0,dur,type){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();var o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+t0;o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.25,n+.02);g.gain.exponentialRampToValueAtTime(.0001,n+dur);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+dur+.05)}catch(e){}}

function say(t,force){
  if((!SND||!SPK)&&!force)return;
  try{
    var ss=window.speechSynthesis;
    if(!ss||!window.SpeechSynthesisUtterance){$("lf").textContent=T("nosound");return}
    loadVox();
    var l=lang==="th"?"th":"en",u=new SpeechSynthesisUtterance(t);
    u.lang=l==="th"?"th-TH":"en-US";u.rate=RATE;u.volume=1;
    var v=VOX.filter(function(x){return x.lang.toLowerCase().replace("_","-").indexOf(l)===0})[0];
    if(v)u.voice=v;else if(l==="th"&&VOX.length)$("lf").textContent=T("novoice");
    u.onerror=function(e){if(e&&e.error!=="canceled"&&e.error!=="interrupted")$("lf").textContent=T("nosound")};
    ss.cancel();setTimeout(function(){try{ss.resume();ss.speak(u)}catch(e){}},60);
  }catch(e){$("lf").textContent=T("nosound")}
}

function stepMatch(D){
  var pool=[],seen={},cards=[];D.items.slice().sort(function(){return Math.random()-.5}).forEach(function(it){var l=o(it[1][it[2]]);if(pool.length<4&&!seen[l]){seen[l]=1;pool.push(it)}});var n=pool.length;
  pool.forEach(function(it,j){var lab=o(it[1][it[2]]);cards.push({k:j,t:it[0],lab:lab});cards.push({k:j,t:lab,lab:lab})});
  cards.sort(function(){return Math.random()-.5});
  setLV("🧠");$("lp").textContent=MODE_P.match[lg()];
  var grid=document.createElement("div");grid.id="lgrid";$("lo").appendChild(grid);

    var b=document.createElement("button");b.className="big";b.textContent="❓";b.setAttribute("aria-label","card");grid.appendChild(b);
    b.onclick=function(){
      if(lock||c.done||sel&&sel.b===b)return;
      b.textContent=c.t;say(c.lab);

        c.done=sel.c.done=true;b.style.background=sel.b.style.background="var(--mint)";b.style.color=sel.b.style.color="#10303a";

        lock=true;sfx("no");var a=sel;sel=null;
        setTimeout(function(){a.b.textContent="❓";b.textContent="❓";lock=false},1000);
      }
    };
  });
}

};
